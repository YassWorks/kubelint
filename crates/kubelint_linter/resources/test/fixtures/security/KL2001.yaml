# Reported: a privileged container in a Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: nginx:1.27
        securityContext:
          privileged: true
---
# Reported: init and ephemeral containers, a YAML 1.1 boolean, flow style and a
# container without a name.
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  initContainers:
  - name: setup
    image: busybox:1.36
    securityContext: {privileged: yes}
  containers:
  - image: app:1.0
    securityContext:
      privileged: True
  ephemeralContainers:
  - name: débogage
    image: busybox:1.36
    securityContext:
      privileged: true
---
# Reported: a DaemonSet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
spec:
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      containers:
      - name: agent
        image: agent:3
        securityContext:
          privileged: true
---
# Reported: a CronJob.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: report
            image: report:2
            securityContext:
              privileged: true
---
# Reported: a StatefulSet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
      - {name: db, image: postgres:17, securityContext: {privileged: true}}
---
# Reported: a Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - {name: migrate, image: app:1.0, securityContext: {privileged: true}}
---
# Not reported: `privileged: false`, no setting, and other security settings.
apiVersion: v1
kind: Pod
metadata:
  name: ok
spec:
  containers:
  - name: a
    image: app:1.0
    securityContext:
      privileged: false
  - name: b
    image: app:1.0
  - name: c
    image: app:1.0
    securityContext:
      allowPrivilegeEscalation: false
---
# Not reported: a quoted "true" and other non-boolean values (schema problems).
apiVersion: v1
kind: Pod
metadata:
  name: typed
spec:
  containers:
  - name: a
    image: app:1.0
    securityContext:
      privileged: "true"
  - name: b
    image: app:1.0
    securityContext:
      privileged: 1
  - name: c
    image: app:1.0
    securityContext:
      privileged:
---
# Not reported: `privileged` at the pod level is not a Kubernetes field.
apiVersion: v1
kind: Pod
metadata:
  name: pod-level
spec:
  securityContext:
    privileged: true
  containers:
  - name: app
    image: app:1.0
---
# Not reported: a custom resource with a pod-like shape.
apiVersion: example.com/v1
kind: Deployment
metadata:
  name: custom
spec:
  template:
    spec:
      containers:
      - name: app
        image: app:1.0
        securityContext:
          privileged: true
