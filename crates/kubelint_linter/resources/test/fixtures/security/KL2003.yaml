# Reported: no settings at all, an empty securityContext, only unrelated settings and a
# non-zero `runAsUser` alone (restricted wants `runAsNonRoot: true`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: nginx:1.27
      - name: empty
        image: app:1.0
        securityContext: {}
      - name: other
        image: app:1.0
        securityContext:
          allowPrivilegeEscalation: false
      - name: user-only
        image: app:1.0
        securityContext:
          runAsUser: 1000
---
# Reported: `runAsUser: 0` on the pod (once, even when a container overrides it) and in a
# container, even with `runAsNonRoot: true`.
apiVersion: v1
kind: Pod
metadata:
  name: root
spec:
  securityContext:
    runAsUser: 0
    runAsNonRoot: true
  initContainers:
  - name: setup
    image: busybox:1.36
    securityContext: {runAsUser: 0}
  containers:
  - name: app
    image: app:1.0
    securityContext:
      runAsUser: 1000
---
# Reported: a pod `runAsNonRoot: false` is reported on the pod, once, whether a container
# leaves it unset, sets it to null or sets `true`. An ephemeral container that sets
# `false` is reported too.
apiVersion: v1
kind: Pod
metadata:
  name: override
spec:
  securityContext:
    runAsNonRoot: false
  containers:
  - name: app
    image: app:1.0
    securityContext:
      runAsNonRoot: ~
  - name: safe
    image: app:1.0
    securityContext:
      runAsNonRoot: true
  ephemeralContainers:
  - name: débogage
    image: busybox:1.36
    securityContext:
      runAsNonRoot: false
---
# Reported: `runAsNonRoot: no` in a container without a name overrides the pod's `true`.
apiVersion: v1
kind: Pod
metadata:
  name: container-override
spec:
  securityContext:
    runAsNonRoot: true
  containers:
  - image: app:1.0
    securityContext:
      runAsNonRoot: no
---
# Reported: a DaemonSet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
spec:
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      containers:
      - {name: agent, image: agent:3}
---
# Reported: a CronJob.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - {name: report, image: report:2}
---
# Reported: a Job whose container has no name (reported at its first key).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - image: app:1.0
---
# Not reported: a pod-level `runAsNonRoot: true` covers every container.
apiVersion: v1
kind: Pod
metadata:
  name: pod-level
spec:
  securityContext:
    runAsNonRoot: true
  initContainers:
  - name: setup
    image: busybox:1.36
  containers:
  - name: app
    image: app:1.0
---
# Not reported: a container `runAsNonRoot: true` next to any non-zero `runAsUser`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
      - name: db
        image: postgres:17
        securityContext: {runAsNonRoot: true, runAsUser: 999}
      - name: exporter
        image: exporter:1
        securityContext: {runAsNonRoot: true}
---
# Reported: `runAsUser: 1000` does not replace `runAsNonRoot: true`, and an explicit
# `runAsNonRoot: false` is reported whatever `runAsUser` says.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-only
spec:
  serviceName: user-only
  selector:
    matchLabels: {app: user-only}
  template:
    metadata:
      labels: {app: user-only}
    spec:
      securityContext:
        runAsUser: 999
      containers:
      - name: db
        image: postgres:17
      - name: backup
        image: backup:1
        securityContext: {runAsUser: 1000, runAsNonRoot: false}
---
# Reported: a pod-level `runAsUser: 0` that every container overrides.
apiVersion: v1
kind: Pod
metadata:
  name: user-override
spec:
  securityContext:
    runAsUser: 0
  containers:
  - name: app
    image: app:1.0
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
---
# Reported: a pod `runAsNonRoot: false` that a container overrides with `true`.
apiVersion: v1
kind: Pod
metadata:
  name: safe-override
spec:
  securityContext:
    runAsNonRoot: false
  containers:
  - name: app
    image: app:1.0
    securityContext:
      runAsNonRoot: true
---
# Not reported: null container values fall back to the pod's safe settings.
apiVersion: v1
kind: Pod
metadata:
  name: null-fallback
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
  - name: a
    image: app:1.0
    securityContext:
      runAsNonRoot: ~
  - name: b
    image: app:1.0
    securityContext:
      runAsUser:
---
# Not reported: values of the wrong type (schema problems).
apiVersion: v1
kind: Pod
metadata:
  name: typed
spec:
  containers:
  - name: a
    image: app:1.0
    securityContext:
      runAsUser: "0"
      runAsNonRoot: true
  - name: b
    image: app:1.0
    securityContext:
      runAsNonRoot: "false"
---
# Reported: a Windows pod without `runAsNonRoot: true` (the server rejects `runAsUser` and
# `hostUsers` there, so this is the only way to satisfy restricted).
apiVersion: v1
kind: Pod
metadata:
  name: windows
spec:
  os:
    name: windows
  containers:
  - name: app
    image: app:1.0
---
# Not reported: a Windows pod with `runAsNonRoot: true`.
apiVersion: v1
kind: Pod
metadata:
  name: windows-ok
spec:
  os:
    name: windows
  securityContext:
    runAsNonRoot: true
  containers:
  - name: app
    image: app:1.0
---
# Not reported: `hostUsers: false` accepts any user, so `runAsUser: 0`, `runAsNonRoot: false`
# and unset values all pass (restricted accepts this from 1.35).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userns
spec:
  selector:
    matchLabels: {app: userns}
  template:
    metadata:
      labels: {app: userns}
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: false
      containers:
      - name: a
        image: app:1.0
      - name: b
        image: app:1.0
        securityContext: {runAsUser: 0}
---
# Reported: `hostUsers: true` is no relaxation.
apiVersion: v1
kind: Pod
metadata:
  name: host-users
spec:
  hostUsers: true
  containers:
  - name: app
    image: app:1.0
---
# Reported: an init container that sets nothing next to a container that sets `true`.
apiVersion: v1
kind: Pod
metadata:
  name: init
spec:
  initContainers:
  - name: setup
    image: busybox:1.36
  containers:
  - name: app
    image: app:1.0
    securityContext: {runAsNonRoot: true}
---
# Not reported: a pod and its containers that set `true`, with null values falling back.
apiVersion: v1
kind: Pod
metadata:
  name: all-true
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  initContainers:
  - name: setup
    image: busybox:1.36
  containers:
  - name: app
    image: app:1.0
    securityContext: {runAsNonRoot: ~, runAsUser: ~}
---
# Not reported: a custom resource with a pod-like shape.
apiVersion: example.com/v1
kind: Deployment
metadata:
  name: custom
spec:
  template:
    spec:
      containers:
      - name: app
        image: app:1.0
---
# Not reported: an object without a pod spec.
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  runAsUser: "0"
---
# Reported: `runAsUser` spelled as a float zero, which the API server reads as 0.
apiVersion: v1
kind: Pod
metadata:
  name: float-zero
spec:
  securityContext:
    runAsNonRoot: true
  containers:
  - name: a
    image: app:1.0
    securityContext: {runAsUser: 0.0}
  - name: b
    image: app:1.0
    securityContext: {runAsUser: 0e0}
