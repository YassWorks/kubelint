  name: user-override
spec:
  securityContext:
    runAsUser: 0
  containers:
  - name: app
    image: app:1.0
    securityContext:
      runAsUser: 1000
---
# Not reported: a container `runAsNonRoot: true` overrides the pod's `false`.
apiVersion: v1
kind: Pod
metadata:
  name: safe-override
spec:
  securityContext:
    runAsNonRoot: false
  containers:
  - name: app
    image: app:1.0
    securityContext:
      runAsNonRoot: true
---
# Not reported: null container values fall back to the pod's safe settings.
apiVersion: v1
kind: Pod
metadata:
  name: null-fallback
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
  - name: a
    image: app:1.0
    securityContext:
      runAsNonRoot: ~
  - name: b
    image: app:1.0
    securityContext:
      runAsUser:
