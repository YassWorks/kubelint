# Reported: `SYS_ADMIN` and `NET_ADMIN` in a Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: nginx:1.27
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
            - NET_BIND_SERVICE
            - NET_ADMIN
---
# Reported: `ALL` in lower case, a `CAP_` prefix, flow style, init and ephemeral
# containers, and a container without a name.
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  initContainers:
  - name: setup
    image: busybox:1.36
    securityContext: {capabilities: {add: [all]}}
  containers:
  - image: app:1.0
    securityContext:
      capabilities:
        add: ["CAP_SYS_PTRACE"]
  ephemeralContainers:
  - name: débogage
    image: busybox:1.36
    securityContext:
      capabilities:
        add: [SYS_MODULE]
---
# Reported: allowed capabilities written in lower case or with the `CAP_` prefix,
# which Pod Security Admission rejects.
apiVersion: v1
kind: Pod
metadata:
  name: spelling
spec:
  containers:
  - name: app
    image: app:1.0
    securityContext:
      capabilities:
        add: [net_bind_service, CAP_SETFCAP]
---
# Reported: a DaemonSet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
spec:
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      containers:
      - {name: agent, image: agent:3, securityContext: {capabilities: {add: [NET_RAW]}}}
---
# Reported: a StatefulSet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
      - {name: db, image: postgres:17, securityContext: {capabilities: {add: [IPC_LOCK]}}}
---
# Reported: a Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - {name: migrate, image: app:1.0, securityContext: {capabilities: {add: [SYS_TIME]}}}
---
# Reported: a CronJob.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - {name: report, image: report:2, securityContext: {capabilities: {add: [BPF]}}}
---
# Not reported: every capability the baseline profile allows, and dropped
# capabilities.
apiVersion: v1
kind: Pod
metadata:
  name: ok
spec:
  containers:
  - name: a
    image: app:1.0
    securityContext:
      capabilities:
        drop: [ALL, SYS_ADMIN]
        add:
        - AUDIT_WRITE
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - FSETID
        - KILL
        - MKNOD
        - NET_BIND_SERVICE
        - SETFCAP
        - SETGID
        - SETPCAP
        - SETUID
        - SYS_CHROOT
  - name: b
    image: app:1.0
---
# Not reported: items that are not strings, and `add` that is not a sequence (schema
# problems).
apiVersion: v1
kind: Pod
metadata:
  name: typed
spec:
  containers:
  - name: a
    image: app:1.0
    securityContext:
      capabilities:
        add: [{name: SYS_ADMIN}, [NET_ADMIN]]
  - name: b
    image: app:1.0
    securityContext:
      capabilities:
        add: SYS_ADMIN
---
# Not reported: capabilities at the pod level are not a Kubernetes field.
apiVersion: v1
kind: Pod
metadata:
  name: pod-level
spec:
  securityContext:
    capabilities:
      add: [SYS_ADMIN]
  containers:
  - name: app
    image: app:1.0
---
# Not reported: a custom resource with a pod-like shape.
apiVersion: example.com/v1
kind: Deployment
metadata:
  name: custom
spec:
  template:
    spec:
      containers:
      - name: app
        image: app:1.0
        securityContext:
          capabilities:
            add: [SYS_ADMIN]
