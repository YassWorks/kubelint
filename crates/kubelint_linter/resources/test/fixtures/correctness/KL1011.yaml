# Reported: the same env var twice in one container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: nginx:1.27
        env:
        - name: LOG_LEVEL
          value: info
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: debug
---
# Reported: a third copy, a quoted name, a `valueFrom` entry and an init container
# (each repeat points back at the first).
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  initContainers:
  - name: setup
    image: busybox:1.36
    env:
    - {name: TOKEN, value: a}
    - name: TOKEN
      valueFrom:
        secretKeyRef: {name: app, key: token}
  containers:
  - name: app
    image: app:1.0
    env:
    - {name: MODE, value: a}
    - {name: "MODE", value: b}
    - {name: MODE, value: c}
---
# Reported: inside a CronJob, with a non-ASCII value.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: report
            image: report:2
            env:
            - name: GREETING
              value: "héllo"
            - name: GREETING
              value: "salut"
---
# Not reported: different names; names are case-sensitive.
apiVersion: v1
kind: Pod
metadata:
  name: ok
spec:
  containers:
  - name: app
    image: app:1.0
    env:
    - {name: MODE, value: a}
    - {name: mode, value: b}
---
# Not reported: the same name in two containers of one pod (each container has its
# own environment).
apiVersion: v1
kind: Pod
metadata:
  name: sidecar
spec:
  initContainers:
  - name: setup
    image: busybox:1.36
    env:
    - {name: MODE, value: a}
  containers:
  - name: app
    image: app:1.0
    env:
    - {name: MODE, value: a}
  - name: proxy
    image: envoyproxy/envoy:v1.31.0
    env:
    - {name: MODE, value: a}
---
# Not reported: missing, empty or non-string names (schema problems).
apiVersion: v1
kind: Pod
metadata:
  name: unnamed
spec:
  containers:
  - name: app
    image: app:1.0
    env:
    - value: a
    - value: a
    - {name: "", value: a}
    - {name: "", value: a}
    - {name: " ", value: a}
    - {name: " ", value: a}
    - {name: [a], value: a}
    - {name: [a], value: a}
---
# Not reported: `envFrom` sources that overlap with `env` are out of scope.
apiVersion: v1
kind: Pod
metadata:
  name: from
spec:
  containers:
  - name: app
    image: app:1.0
    envFrom:
    - configMapRef: {name: app}
    env:
    - {name: MODE, value: a}
