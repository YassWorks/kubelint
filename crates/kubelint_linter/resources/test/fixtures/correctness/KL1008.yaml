# Reported: uppercase and an underscore in a Deployment name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: My_App
---
# Reported: a trailing dot, and a name longer than 253 characters.
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings.
---
apiVersion: v1
kind: Secret
metadata:
  name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
---
# Reported: a dot in a Namespace name (a DNS-1123 label).
apiVersion: v1
kind: Namespace
metadata:
  name: team.payments
---
# Reported: a Service name starting with a digit (a DNS-1035 label), and one with a
# space.
apiVersion: v1
kind: Service
metadata:
  name: 1-api
---
apiVersion: v1
kind: Service
metadata:
  name: "web server"
---
# Reported: an RBAC name with a slash.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: team/reader
---
# Reported: an invalid namespace on a custom resource.
apiVersion: example.com/v1
kind: Widget
metadata:
  name: Anything_Goes
  namespace: Team_A
---
# Not reported: the server ignores `metadata.namespace` on a cluster-scoped kind.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reader
  namespace: Team_A
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  namespace: Team_A
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast
  namespace: Team_A
---
# Reported: the namespace of a namespaced built-in kind.
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: Team_A
---
# Reported: a cluster-scoped kind still has its name checked.
apiVersion: v1
kind: Namespace
metadata:
  name: Team_A
  namespace: fine
---
# Not reported: valid names for each format, including a subdomain with dots, an
# uppercase-free RBAC name with colons, and a namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web.v2-1
  namespace: prod-eu
---
apiVersion: v1
kind: Service
metadata:
  name: web
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:controller:Reader
---
# Not reported: custom resources and other API groups choose their own name rules.
apiVersion: example.com/v1
kind: Deployment
metadata:
  name: My_Deployment
---
# Not reported: non-string and empty names are schema problems or KL1003's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: 1234
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ""
---
# Not reported: placeholders of template tools in a name and a namespace.
apiVersion: batch/v1
kind: Job
metadata:
  name: process-item-$ITEM
  namespace: ${NAMESPACE}
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: etcd-{{cell}}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-web"
---
# Reported: a `$` that starts no placeholder.
apiVersion: v1
kind: ConfigMap
metadata:
  name: price-$5
