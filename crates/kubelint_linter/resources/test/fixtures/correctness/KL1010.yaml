# Reported: free text in a label value and a key with a space.
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  labels:
    owner: team@example.com
    Team Name: payments
---
# Reported: values YAML reads as a number and a boolean.
# e2e-skip: a schema problem, which kubectl rejects before it sends the object
apiVersion: v1
kind: ConfigMap
metadata:
  name: flags
  labels:
    version: 1.0
    canary: yes
---
# Reported: a bad key prefix, too many slashes, an empty name part, and a value that
# starts with a dash.
apiVersion: v1
kind: Secret
metadata:
  name: token
  labels:
    Example.com/tier: web
    a/b/c: x
    example.com/: x
    track: -stable
---
# Reported: a selector label of a Deployment with a colon, and a pod template label over
# 63 characters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: "web: frontend"
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.27
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-build
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        build: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    spec:
      containers:
      - name: web
        image: nginx:1.27
---
# Reported: both CronJob templates, a ReplicationController's plain selector and a
# Service selector.
# e2e-skip: the server accepts it, and rejects each Job the CronJob controller makes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-job
spec:
  schedule: "0 * * * *"
  jobTemplate:
    metadata:
      labels:
        job type: report
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: report
            image: report:1.0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            run: "every hour"
        spec:
          restartPolicy: OnFailure
          containers:
          - name: report
            image: report:1.0
---
# e2e-skip: the server says only that the selector does not match the template labels
apiVersion: v1
kind: ReplicationController
metadata:
  name: legacy
spec:
  selector:
    app: legacy app
  template:
    metadata:
      labels:
        app: legacy
    spec:
      containers:
      - name: app
        image: app:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web_
---
# Not reported: valid keys and values, including uppercase, `_`, `.`, a 63-character
# value, an empty value, a null value and quoted numbers.
apiVersion: v1
kind: Pod
metadata:
  name: valid
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/version: "1.0"
    Tier: Front_End.v2
    empty: ""
    unset:
    canary: "true"
    build: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
spec:
  containers:
  - name: app
    image: app:1.0
---
# Not reported: annotations take free text, and a custom resource's spec.selector is
# its own business.
# e2e-skip: a custom resource, unknown to the server
apiVersion: example.com/v1
kind: Service
metadata:
  name: custom
  annotations:
    owner: team@example.com
spec:
  selector:
    app: not a label
---
# Not reported: placeholders of template tools, whose final text kubelint cannot see.
# e2e-skip: a template placeholder, which its tool replaces before the server sees it
apiVersion: v1
kind: Pod
metadata:
  name: templated
  labels:
    keyspace: "{{keyspace}}"
    shard: "{{ .Values.shard }}"
    tablet: ${TABLET_ALIAS}
    "{{label_key}}": web
    build: $(BUILD_ID)
spec:
  containers:
  - name: app
    image: app:1.0
---
# Reported: a `$` that starts no placeholder, and a single brace.
apiVersion: v1
kind: Pod
metadata:
  name: almost-templated
  labels:
    price: costs-$5
    team: "{team}"
spec:
  containers:
  - name: app
    image: app:1.0
---
# Reported: a PodTemplate keeps its pod labels at `template.metadata.labels`.
apiVersion: v1
kind: PodTemplate
metadata:
  name: tmpl
template:
  metadata:
    labels:
      app: web
      bad label: x
  spec:
    containers:
    - name: app
      image: app:1.0
---
# Not reported: a merge key is not a label key, and the merged labels are valid.
apiVersion: v1
kind: Pod
metadata:
  name: merged
  labels:
    <<: {app: cafe, tier: front}
spec:
  containers:
  - name: app
    image: app:1.0
---
# Reported: a merged label is checked as if written there.
apiVersion: v1
kind: Pod
metadata:
  name: merged-bad
  labels: {<<: {bad label: x}}
spec:
  containers:
  - name: app
    image: app:1.0
