# Not reported: every null spelling is null, in the selector and the template.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: null-spellings
spec:
  selector:
    matchLabels:
      app: web
      k:
      j: ~
      i: Null
      h: NULL
  template:
    metadata:
      labels:
        app: web
        k: ~
        j: null
        i: NULL
        h: Null
    spec:
      containers: []
