---
# Not reported: the template labels merge the anchored selector labels, as kubectl reads them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merged
spec:
  selector:
    matchLabels: &labels
      app: web
  template:
    metadata:
      labels:
        <<: *labels
        tier: front
    spec:
      containers: []
---
# Reported: an explicit label after the merge overrides the selector's value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overridden
spec:
  selector:
    matchLabels: &labels
      app: web
  template:
    metadata:
      labels:
        <<: *labels
        app: other
    spec:
      containers: []
---
# Reported: a quoted "null" is text, and the template value is null.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quoted-null
spec:
  selector:
    matchLabels:
      app: web
      k: "null"
  template:
    metadata:
      labels:
        app: web
        k: null
    spec:
      containers: []
---
# Reported: a null template value never equals a non-empty selector value.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: null-label
spec:
  serviceName: db
  selector:
    matchLabels:
      app: web
      k: x
  template:
    metadata:
      labels:
        app: web
        k: ~
    spec:
      containers: []
---
# Reported: `null` in `values` is an empty value, which the template's `x` fails.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: null-in-values
spec:
  selector:
    matchExpressions:
    - {key: app, operator: In, values: [web]}
    - {key: k, operator: In, values: [null]}
  template:
    metadata:
      labels:
        app: web
        k: x
    spec:
      containers: []
---
# Reported: a null template value against a ReplicationController's plain map.
apiVersion: v1
kind: ReplicationController
metadata:
  name: rc-null-label
spec:
  selector:
    app: web
    k: x
  template:
    metadata:
      labels:
        app: web
        k: null
    spec:
      containers: []
---
