# Not reported: no selector, an unknown operator, or values of the wrong type
# (schema problems for other rules).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-selector
spec:
  template:
    metadata:
      labels: {app: x}
    spec:
      containers: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odd
spec:
  selector:
    matchLabels:
      app: [x]
    matchExpressions:
    - {key: app, operator: Matches, values: [x]}
    - {key: app, operator: In, values: [{a: b}]}
  template:
    metadata:
      labels: {app: y}
    spec:
      containers: []
---
