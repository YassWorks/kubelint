# Reported: a top-level key given twice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
data:
  mode: fast
data:
  mode: slow
---
# Reported: a nested key given twice; the message names the path to its mapping.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          image: nginx:1.27
          image: nginx:latest
---
# Reported twice: a key given three times; both repeats point back at the first.
