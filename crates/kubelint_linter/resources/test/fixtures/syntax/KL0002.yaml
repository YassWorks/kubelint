# Reported: a top-level key given twice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
data:
  mode: fast
data:
  mode: slow
---
# Reported: a nested key given twice; the message names the path to its mapping.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          image: nginx:1.27
          image: nginx:latest
---
# Reported twice: a key given three times; both repeats point back at the first.
apiVersion: v1
kind: Service
metadata:
  name: café
  labels:
    app: a
    app: b
    app: c
---
# Reported: quoting does not make a key different, and empty values count.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quoted
  annotations:
    "example.com/owner": team-a
    example.com/owner: team-b
data:
  empty:
  empty:
---
# Reported: flow style.
apiVersion: v1
kind: Pod
metadata: {name: flow, name: flow2}
---
# Not reported: the same key in different mappings, and keys that differ in case.
apiVersion: v1
kind: Pod
metadata:
  name: sidecars
  labels:
    App: web
    app: web
spec:
  containers:
    - name: web
      image: nginx:1.27
    - name: proxy
      image: envoy:1.31
---
# Not reported: not a Kubernetes object, kubelint does not check it.
build:
  steps: [compile]
build:
  steps: [test]
---
# Reported: a top-level duplicate in an object without a kind, named by the last `metadata`.
apiVersion: v1
metadata:
  name: first
metadata:
  name: second
---
# Reported: a top-level duplicate in an object without a name.
apiVersion: v1
kind: ConfigMap
data: {a: "1"}
data: {b: "2"}
---
# Reported: an explicit key given twice stays a duplicate when a merge key is in the mapping.
apiVersion: v1
kind: ConfigMap
metadata:
  name: café
  labels:
    <<: {tier: front}
    app: a
    app: b
---
# Not reported: a merge repeats a key, and the explicit key after it overrides the merged one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: merged
  labels: &labels
    app: web
    team: "é"
data:
  <<: *labels
  team: explicit
  extra: "1"
---
# Not reported: an explicit key before a merge that repeats it, and two merged sources that
# share a key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sources
data:
  app: before
  <<: [{app: first, one: "1"}, {app: second, one: "2"}]
---
# Not reported: a quoted `"<<"` is an ordinary key once.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quoted
data:
  "<<": literal
---
# Reported: a quoted `"<<"` is an ordinary key, so it can be a duplicate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quoted-twice
data:
  "<<": a
  "<<": b
---
# Reported: a key repeated inside an inline merge source.
apiVersion: v1
kind: ConfigMap
metadata: {name: inline-source}
data:
  <<: {a: "1", a: "2"}
---
# Reported: a key repeated inside an inline source of a sequence.
apiVersion: v1
kind: ConfigMap
metadata: {name: sequence-source}
data:
  <<: [{a: "1", a: "2"}]
---
# Reported: a key repeated inside an anchored merge source, at the anchor.
apiVersion: v1
kind: ConfigMap
metadata: {name: anchored-source}
x-source: &source
  a: "1"
  a: "2"
data:
  <<: *source
---
# Reported: two written keys before a merge that repeats the key.
apiVersion: v1
kind: ConfigMap
metadata: {name: before-merge}
data:
  a: "1"
  a: "2"
  <<: {a: "3"}
---
# Reported: two written keys around a merge that repeats the key.
apiVersion: v1
kind: ConfigMap
metadata: {name: around-merge}
data:
  a: one
  <<: {a: merged}
  a: two
---
# Reported: two written keys after a merge that repeats the key.
apiVersion: v1
kind: ConfigMap
metadata: {name: after-merge}
data:
  <<: {a: "3"}
  a: "1"
  a: "2"
---
# Not reported: a written key before a merge that repeats it, and one after another merge.
apiVersion: v1
kind: ConfigMap
metadata: {name: written-and-merged}
data:
  a: before
  <<: {a: merged, b: merged}
  b: after
---
# Not reported: a merge source that merges, and a written key that overrides the merged one.
apiVersion: v1
kind: ConfigMap
metadata: {name: nested-source}
x-source: &source
  a: "1"
  <<: {a: "2"}
data:
  <<: *source
  a: "3"
---
# Not reported: the key that holds the repeat is overridden by the merge, so the server
# never reads it.
apiVersion: v1
kind: ConfigMap
metadata: {name: overridden-value}
x:
  a: {k: 1, k: 2}
  <<: {a: {}}
