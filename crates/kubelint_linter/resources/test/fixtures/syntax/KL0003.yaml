# Reported: a rule name with a typo, next to a valid code that is not reported.
apiVersion: v1
kind: Pod
metadata:
  name: web
  # kubelint-disable-next-line KL1001, missing-kinds -- typo in the name
  labels: {app: wéb}
---
# Reported: KL0001 cannot be suppressed, by code or by name.
apiVersion: v1
kind: Service  # kubelint-disable-line KL0001, invalid-yaml
---
# Reported: a category is not accepted, only codes and names.
# kubelint-disable-file security
apiVersion: v1
kind: Secret
---
# Reported: a directive that names no rule, with or without a reason.
apiVersion: v1
kind: ConfigMap  # kubelint-disable-line -- just because
data: {}  # kubelint-disable-line
---
# Not reported: codes and names of real rules, even ones that are not enabled.
# kubelint-disable-file duplicate-key
apiVersion: v1
kind: ConfigMap
metadata:
  name: fine  # kubelint-disable-line KL1002,missing-api-version
---
# Not reported: comments that only mention a directive, or a longer keyword.
# see kubelint-disable-line nope
# kubelint-disable-lines nope
apiVersion: v1
kind: ConfigMap
---
# Reported: an annotation with a typo and a category, next to a valid name and code.
apiVersion: v1
kind: Pod
metadata:
  name: annotated
  annotations:
    kubelint/ignore: "privileged-containers, KL3003,security, run-as-root"
---
# Reported: an annotation that names KL0001, and one that names no rule.
apiVersion: v1
kind: List
items:
- {apiVersion: v1, kind: ConfigMap, metadata: {name: a, annotations: {kubelint/ignore: invalid-yaml}}}
- {apiVersion: v1, kind: ConfigMap, metadata: {name: b, annotations: {kubelint/ignore: " , "}}}
---
# Not reported: an annotation that is not a string, and other annotations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: other
  annotations:
    kubelint/ignore: [nope]
    example.com/ignore: nope
