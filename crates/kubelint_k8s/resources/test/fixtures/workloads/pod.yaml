# Pod: the pod spec is `spec`. All three container lists, in an unusual order (é).
apiVersion: v1
kind: Pod
metadata:
  name: débug
spec:
  securityContext:
    runAsNonRoot: true
  ephemeralContainers:
    - name: shell
      image: busybox:1.36
  initContainers:
    - name: migrate
      image: app:1.0
  containers:
    - name: app
      image: app:1.0
      securityContext:
        privileged: false
      resources:
        limits: {memory: 128Mi}
      env:
        - {name: MODE, value: prod}
      livenessProbe: {httpGet: {path: /healthz, port: 8080}}
      readinessProbe: {httpGet: {path: /ready, port: 8080}}
      startupProbe: {tcpSocket: {port: 8080}}
    # Not a mapping: skipped.
    - just-a-string
