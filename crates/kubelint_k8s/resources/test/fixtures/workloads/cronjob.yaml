# CronJob: the pod spec is `spec.jobTemplate.spec.template.spec` (é).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: backup:2.0
              resources: {requests: {cpu: 100m}}
