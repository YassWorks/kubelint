# Deployment: the pod spec is `spec.template.spec` (é).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wéb
spec:
  template:
    spec:
      initContainers:
        - name: init
          image: busybox:1.36
      containers:
        - name: web
          image: nginx:1.27
---
# Old API group: still a Deployment.
apiVersion: extensions/v1beta1
kind: Deployment
spec:
  template:
    spec:
      containers: [{name: legacy, image: nginx:1.9}]
---
# A custom resource with the same kind name in another group: not a workload.
apiVersion: example.com/v1
kind: Deployment
spec:
  template:
    spec:
      containers: [{name: custom}]
---
# Missing apiVersion: the kind alone decides.
kind: Deployment
spec:
  template:
    spec:
      containers: [{name: no-api-version}]
---
# No pod template yet: no pod spec.
apiVersion: apps/v1
kind: Deployment
spec:
  replicas: 2
