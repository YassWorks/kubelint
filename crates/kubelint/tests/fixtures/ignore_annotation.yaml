# KL3001 and KL3003 are silenced here: KL2001 is still reported.
apiVersion: v1
kind: Pod
metadata:
  name: web
  annotations:
    kubelint/ignore: "KL3001, unpinned-image-tag"
spec:
  containers:
  - name: web
    image: nginx
    securityContext: {privileged: true, runAsNonRoot: true}
    resources:
      requests: {cpu: 100m, memory: 64Mi}
---
# The duplicate is reported on this object, so its annotation silences KL1004.
apiVersion: v1
kind: Pod
metadata:
  name: web
  annotations: {kubelint/ignore: duplicate-object}
spec:
  containers:
  - name: web
    image: nginx:1.27
    securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true}
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {memory: 64Mi}
---
# Nothing is silenced on an object without the annotation.
apiVersion: v1
kind: Pod
metadata:
  name: api
spec:
  containers:
  - name: api
    image: api
    securityContext: {runAsNonRoot: true}
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {memory: 64Mi}
---
# In a List, the annotation covers its own item only: `b` is reported.
apiVersion: v1
kind: List
items:
- {apiVersion: v1, kind: Pod, metadata: {name: a, annotations: {kubelint/ignore: KL3003}}, spec: {containers: [{name: a, image: "a:latest", securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true}, resources: {requests: {cpu: 1m, memory: 1Mi}, limits: {memory: 1Mi}}}]}}
- {apiVersion: v1, kind: Pod, metadata: {name: b}, spec: {containers: [{name: b, image: "b:latest", securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true}, resources: {requests: {cpu: 1m, memory: 1Mi}, limits: {memory: 1Mi}}}]}}
