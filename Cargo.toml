[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["YassWorks and kubelint contributors"]
repository = "https://github.com/YassWorks/kubelint"
homepage = "https://github.com/YassWorks/kubelint"

[workspace.dependencies]
# Internal crates. Dependency direction is documented in docs/architecture.md.
kubelint_source = { path = "crates/kubelint_source" }
kubelint_yaml = { path = "crates/kubelint_yaml" }
kubelint_diagnostics = { path = "crates/kubelint_diagnostics" }
kubelint_k8s = { path = "crates/kubelint_k8s" }
kubelint_config = { path = "crates/kubelint_config" }
kubelint_linter = { path = "crates/kubelint_linter" }
kubelint_output = { path = "crates/kubelint_output" }

# Pre-approved external crates (see docs/conventions.md#dependencies).
# Declared here so every crate uses the same version. Add `foo = { workspace = true }`
# to a crate's Cargo.toml to use one.
annotate-snippets = "0.12.17"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
insta = "1.49.0"
rayon = "1.12.0"
saphyr-parser = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
text-size = "1.1.1"
thiserror = "2.0.21"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they give in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Restriction lints we opt into. Tests are exempted in clippy.toml.
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
