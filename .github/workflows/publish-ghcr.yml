name: Publish container image

# release.yml calls this after it publishes the GitHub release (docs/conventions.md#releases).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash .github/scripts/publish-ghcr.sh
        env:
          PLAN: ${{ inputs.plan }}
          IMAGE: ghcr.io/yassworks/kubelint
          RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases/download
